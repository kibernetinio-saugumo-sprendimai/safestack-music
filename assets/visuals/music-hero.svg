<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">SafeStack Sound Archive</title>
  <desc id="desc">A dark neon visual identity card for the SafeStack YouTube music catalogue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100b2b"/><stop offset=".55" stop-color="#211257"/><stop offset="1" stop-color="#071d3b"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff4ecd"/><stop offset=".5" stop-color="#8c7bff"/><stop offset="1" stop-color="#43e6d2"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="170" r="170" fill="#ff4ecd" opacity=".15" filter="url(#blur)"/>
  <circle cx="830" cy="300" r="120" fill="#43e6d2" opacity=".12" filter="url(#blur)"/>
  <g transform="translate(76 68)">
    <circle cx="98" cy="98" r="90" fill="#0b0923" stroke="#ff4ecd" stroke-width="4"/>
    <circle cx="98" cy="98" r="45" fill="none" stroke="#8c7bff" stroke-width="12"/>
    <circle cx="98" cy="98" r="12" fill="#43e6d2"/>
    <path d="M98 8a90 90 0 0 1 78 45" fill="none" stroke="#43e6d2" stroke-width="5" stroke-linecap="round"/>
    <path d="M98 98 175 64" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g fill="#fff" font-family="Arial,Helvetica,sans-serif">
    <text x="330" y="116" font-size="24" letter-spacing="6" fill="#ff4ecd">SAFESTACK / SOUND ARCHIVE</text>
    <text x="330" y="174" font-size="55" font-weight="700">MUSIC LINKS</text>
    <text x="333" y="214" font-size="18" fill="#c8c3eb">A hand-picked listening map for the A B (SafeStack) channel.</text>
    <text x="333" y="275" font-size="16" letter-spacing="2" fill="#43e6d2">100 LINKS   ·   1 PLAYLIST   ·   0 COPIED MEDIA</text>
  </g>
  <g transform="translate(980 105)">
    <path d="M0 100h190" stroke="#8c7bff" stroke-opacity=".4"/>
    <path d="M0 100V54M18 100V20M36 100V76M54 100V40M72 100V8M90 100V62M108 100V28M126 100V82M144 100V45M162 100V14M180 100V66" stroke="url(#wave)" stroke-width="8" stroke-linecap="round"/>
    <text x="0" y="140" fill="#c8c3eb" font-size="12" letter-spacing="2">PLAY / DISCOVER / REPEAT</text>
  </g>
</svg>
